contract.pdf.commitmentsHeading=COMMITMENTS OF THE PARTIES
contract.pdf.collegeCommitmentsTitle=The College agrees to:
contract.pdf.collegeCommitments=provide academic supervision to the intern and follow up on the internship;\n\
  keep in touch with the company supervisor during the internship and step in if difficulties arise;\n\
  assess the intern''s learning, taking the company''s evaluation into account.
contract.pdf.employerCommitmentsTitle=The employer agrees to:
contract.pdf.employerCommitments=give the intern tasks related to their program of study, as described in this contract;\n\
  appoint a supervisor who welcomes and guides the intern and informs them of company rules, including occupational health and safety;\n\
  pay the intern according to the terms of this contract and comply with applicable labour standards;\n\
  evaluate the intern at the end of the internship and inform the College of any problem.
contract.pdf.studentCommitmentsTitle=The intern agrees to:
contract.pdf.studentCommitments=follow company rules, be punctual and keep company information confidential;\n\
  carry out assigned tasks professionally and inform their supervisor of any difficulty;\n\
  notify the employer and the College of any absence;\n\
  submit the internship work and reports required by the College.
