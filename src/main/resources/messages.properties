contract.pdf.commitmentsHeading=ENGAGEMENTS DES PARTIES
contract.pdf.collegeCommitmentsTitle=Le Collège s''engage à :
contract.pdf.collegeCommitments=assurer l''encadrement pédagogique du stagiaire et le suivi du stage;\n\
  communiquer avec le superviseur de l''entreprise pendant le stage et intervenir en cas de difficulté;\n\
  évaluer les apprentissages du stagiaire en tenant compte de l''évaluation de l''entreprise.
contract.pdf.employerCommitmentsTitle=L''employeur s''engage à :
contract.pdf.employerCommitments=confier au stagiaire des tâches liées à son programme d''études, telles que décrites dans ce contrat;\n\
  désigner un superviseur qui accueille et encadre le stagiaire et l''informe des règles de l''entreprise, notamment en santé et sécurité au travail;\n\
  rémunérer le stagiaire selon les conditions de ce contrat et respecter les normes du travail en vigueur;\n\
  évaluer le stagiaire à la fin du stage et informer le Collège de toute situation problématique.
contract.pdf.studentCommitmentsTitle=Le stagiaire s''engage à :
contract.pdf.studentCommitments=respecter les règlements de l''entreprise, être ponctuel et garder confidentielles les informations de l''entreprise;\n\
  accomplir les tâches confiées avec professionnalisme et informer son superviseur de toute difficulté;\n\
  aviser l''employeur et le Collège de toute absence;\n\
  remettre au Collège les travaux et les rapports de stage demandés.
