services:
  postgres:
    image: postgres:17
    container_name: rsbjwt-postgres
    environment:
      POSTGRES_DB: rsbjwt
      POSTGRES_USER: rsbjwt
      POSTGRES_PASSWORD: rsbjwt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate
    container_name: rsbjwt-libretranslate
    command: ["--load-only", "fr,en", "--threads", "4"]
    ports:
      - "5000:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    restart: unless-stopped

volumes:
  pgdata:
  libretranslate_models: