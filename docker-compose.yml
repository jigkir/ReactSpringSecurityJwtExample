services:

  postgres:
    image: postgres:17
    container_name: rsbjwt-postgres
    environment:
      POSTGRES_DB: rsbjwt
      POSTGRES_USER: rsbjwt
      POSTGRES_PASSWORD: rsbjwt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: